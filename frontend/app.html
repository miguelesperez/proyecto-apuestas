<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuestas Fútbol</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <div class="marca">⚽ Apuestas <span>Fútbol</span></div>
    <div class="barra-derecha">
      <span id="nombre-usuario"></span>
      <span class="saldo-chip">Saldo: <strong id="saldo">—</strong></span>
      <button class="enlace-boton" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenedor">
    <nav class="pestanas">
      <button class="pestana activa" data-panel="panel-partidos">Partidos</button>
      <button class="pestana" data-panel="panel-apuestas">Mis apuestas</button>
      <button class="pestana" data-panel="panel-cuenta">Recargar saldo</button>
    </nav>

    <div id="mensaje" class="mensaje" hidden></div>

    <!-- PARTIDOS disponibles: GET /api/partidos (PARTIDOS :3001) -->
    <section class="panel" id="panel-partidos">
      <h2>Partidos disponibles</h2>
      <p class="vacio" style="padding-top:0">Toca una cuota para apostar.</p>
      <div class="rejilla" id="lista-partidos"></div>
    </section>

    <!-- MIS APUESTAS: GET /api/apuestas (APUESTAS :3003) -->
    <section class="panel" id="panel-apuestas" hidden>
      <div class="tarjeta">
        <h2>Mis apuestas</h2>
        <div class="tabla-scroll">
          <table>
            <thead>
              <tr>
                <th>Partido</th>
                <th>Apuesta</th>
                <th class="num">Monto</th>
                <th class="num">Cuota</th>
                <th class="num">Ganancia posible</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-apuestas"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- RECARGAR: PUT /api/usuarios/:id/saldo (USUARIOS :3002) -->
    <section class="panel" id="panel-cuenta" hidden>
      <div class="tarjeta" style="max-width:460px">
        <h2>Recargar saldo</h2>
        <form id="form-recarga">
          <div class="campo">
            <label for="monto-recarga">Monto a recargar</label>
            <input id="monto-recarga" type="number" min="1" step="0.01" required>
          </div>
          <button class="boton" type="submit">Recargar</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Ventana para confirmar una apuesta -->
  <dialog id="dialogo-apuesta">
    <form class="dialogo-cuerpo" id="form-apuesta" method="dialog">
      <h3>Nueva apuesta</h3>
      <div class="resumen-apuesta">
        <div><span>Partido</span><strong id="ap-partido"></strong></div>
        <div><span>Apuesta</span><strong id="ap-tipo"></strong></div>
        <div><span>Cuota</span><strong id="ap-cuota"></strong></div>
      </div>
      <div class="campo">
        <label for="ap-monto">Monto</label>
        <input id="ap-monto" type="number" min="1" step="0.01" required>
      </div>
      <p class="ganancia">Ganancia posible: <strong id="ap-ganancia">$0,00</strong></p>
      <div id="mensaje-apuesta" class="mensaje" hidden></div>
      <div class="acciones">
        <button class="boton boton-secundario" type="button" id="btn-cancelar">Cancelar</button>
        <button class="boton" type="submit" id="btn-apostar">Apostar</button>
      </div>
    </form>
  </dialog>

  <div class="pie" id="pie-backend"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
